services:
  mysql:
    image: mysql:8.0
    container_name: sistema-aduanero-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_aduanero
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: